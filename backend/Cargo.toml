[package]
name = "webgame-server"
version = "0.1.0"
edition = "2024"
# Edition 2024 + let-chains need 1.88; the locked uuid 1.29 needs 1.89.
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "9", default-features = false }
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
