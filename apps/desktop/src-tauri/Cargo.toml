[package]
name = "pixelforge-arcade"
version = "0.1.0"
description = "Pixelforge Arcade desktop app"
authors = ["Pixelforge"]
edition = "2021"
rust-version = "1.80"

[lib]
# Distinct lib name avoids a Windows name clash between the bin and lib outputs.
name = "pixelforge_arcade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
