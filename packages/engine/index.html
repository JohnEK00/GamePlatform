<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pixelforge Playground</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #player { display: block; width: 100%; height: 100%; border: 0; background: #000; }
    #bar {
      position: fixed; bottom: 8px; left: 8px; z-index: 10; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      font: 12px/1.2 system-ui, sans-serif; color: #cfd6ee; background: rgba(15, 18, 32, 0.82);
      border: 1px solid #2c3554; border-radius: 8px; padding: 6px 8px; max-width: calc(100vw - 32px);
    }
    #bar select, #bar button {
      font: inherit; color: #e8ecf4; background: #1e2540; border: 1px solid #36406a; border-radius: 5px; padding: 3px 8px; cursor: pointer;
    }
    #log { color: #8ea2ff; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bar.min > :not(#toggle) { display: none; }
    #bar a { color: #8ea2ff; }
    #toasts { position: fixed; top: 12px; right: 12px; z-index: 20; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { display: flex; gap: 10px; align-items: center; min-width: 240px; max-width: min(360px, calc(100vw - 24px)); padding: 10px 12px;
      font: 13px/1.3 system-ui, sans-serif; color: #e8ecf4; background: rgba(20, 22, 44, 0.95); border: 1px solid #6b5cff; border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.5); animation: tin .3s ease-out; transition: opacity .5s, transform .5s; }
    .toast img { width: 40px; height: 40px; flex: none; }
    .toast b { display: block; color: #ffd93d; }
    .toast.out { opacity: 0; transform: translateX(30px); }
    @keyframes tin { from { opacity: 0; transform: translateX(30px); } }
  </style>
</head>
<body>
  <div id="bar">
    <button id="toggle" title="Collapse">☰</button>
    <strong>Pixelforge</strong>
    <select id="game"></select>
    <button data-msg="webgame:pause">Pause</button>
    <button data-msg="webgame:resume">Resume</button>
    <button id="mute">Mute</button>
    <button id="clear" title="Delete this game's saved storage and reload">Clear save</button>
    <a id="studio" href="/studio.html" title="Run the selected example through the studio protocol (in-memory files)">Studio mode</a>
    <span id="log">host messages appear here</span>
  </div>
  <div id="toasts"></div>
  <iframe id="player" sandbox="allow-scripts" allow="autoplay; fullscreen; gamepad" title="game"></iframe>
  <script type="module">
    // Dev playground host: loads player.html (which mirrors the backend player page) in a sandboxed
    // iframe and plays the parent role: storage handshake (webgame:hello -> webgame:load), persisting
    // webgame:save to localStorage under webgame.save.{gameId}, fullscreen, pause/resume/mute.
    const params = new URLSearchParams(location.search);
    const select = document.getElementById('game');
    const log = document.getElementById('log');
    const frame = document.getElementById('player');
    const names = await fetch('/examples/index.json').then((r) => r.json()).catch(() => []);
    const name = params.get('game') || names[0] || 'space-dodge';
    for (const n of names) select.add(new Option(n, n, false, n === name));
    select.onchange = () => { location.search = '?game=' + encodeURIComponent(select.value); };
    const saveKey = `webgame.save.${name}`;
    const MAX_SAVE = 256 * 1024;
    let meta = null;
    const toasts = document.getElementById('toasts');
    function toast(title, text, icon) {
      const el = document.createElement('div');
      el.className = 'toast';
      if (icon) { const img = document.createElement('img'); img.src = icon; img.alt = ''; el.append(img); }
      const body = document.createElement('div');
      const h = document.createElement('b'); h.textContent = 'Achievement unlocked: ' + title;
      const p = document.createElement('span'); p.textContent = text;
      body.append(h, p); el.append(body); toasts.append(el);
      setTimeout(() => el.classList.add('out'), 3600);
      setTimeout(() => el.remove(), 4200);
    }
    const toGame = (msg) => frame.contentWindow?.postMessage(msg, '*');

    let muted = false;
    document.getElementById('mute').onclick = () => {
      muted = !muted;
      toGame({ type: 'webgame:mute', muted });
      document.getElementById('mute').textContent = muted ? 'Unmute' : 'Mute';
    };
    document.getElementById('clear').onclick = () => { localStorage.removeItem(saveKey); location.reload(); };
    for (const b of document.querySelectorAll('[data-msg]')) b.onclick = () => toGame({ type: b.dataset.msg });
    document.getElementById('toggle').onclick = () => document.getElementById('bar').classList.toggle('min');
    for (const b of document.querySelectorAll('#bar button, #bar select')) b.addEventListener('keydown', (e) => e.preventDefault());

    window.addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow) return;
      const d = e.data;
      if (!d || typeof d.type !== 'string' || !d.type.startsWith('webgame:')) return;
      console.info('[host] received', d);
      switch (d.type) {
        case 'webgame:hello': {
          let data = null;
          try { data = JSON.parse(localStorage.getItem(saveKey) || 'null'); } catch { data = null; }
          toGame({ type: 'webgame:load', data });
          log.textContent = data ? 'hello -> load (saved data)' : 'hello -> load (null)';
          return;
        }
        case 'webgame:save': {
          const json = JSON.stringify(d.data ?? null);
          if (json.length > MAX_SAVE) { log.textContent = 'save rejected: over 256KB'; return; }
          localStorage.setItem(saveKey, json);
          log.textContent = `saved ${json.length} bytes`;
          return;
        }
        case 'webgame:fullscreen':
          if (document.fullscreenElement) document.exitFullscreen?.();
          else frame.requestFullscreen?.().catch(() => {});
          log.textContent = 'fullscreen';
          return;
        case 'webgame:score':
          log.textContent = `score submitted: ${d.score}`;
          if (typeof d.requestId === 'string') { // F001: dev harness echoes a fake result
            const display = String(d.score);
            toGame({ type: 'webgame:score-result', requestId: d.requestId, result: { score: d.score, display, rank: 1, personalBest: true, ranks: { day: 1, week: 1, all: 1 } } });
          }
          return;
        case 'webgame:leaderboard-get': { // F001: sample board, like the Studio preview
          const lb = meta?.leaderboard || {};
          const asc = lb.order === 'asc';
          const n = Math.max(1, Math.min(25, Math.round(Number(d.limit)) || 10));
          const entries = Array.from({ length: Math.min(5, n) }, (_, i) => {
            const score = asc ? 30000 + i * 4500 : 5000 - i * 750;
            return { rank: i + 1, name: `Player ${i + 1}`, score, display: lb.format === 'time' ? `${Math.floor(score / 60000)}:${String(Math.floor(score / 1000) % 60).padStart(2, '0')}.${String(score % 1000).padStart(3, '0')}` : score.toLocaleString(), isMe: false };
          });
          toGame({ type: 'webgame:leaderboard', requestId: d.requestId, leaderboard: { period: d.period, order: asc ? 'asc' : 'desc', format: lb.format === 'time' ? 'time' : 'number', label: lb.label || '', totalPlayers: entries.length, entries, me: null, sample: true } });
          log.textContent = `leaderboard-get ${d.period}/${d.limit} (sample data)`;
          return;
        }
        case 'webgame:achievement': {
          const a = (meta?.achievements || []).find((x) => x.id === d.id);
          toast(a ? a.name : d.id, a ? a.description || '' : 'not declared in game.json!', a?.icon ? `/examples/${encodeURIComponent(name)}/${a.icon}` : null);
          log.textContent = `achievement: ${d.id}`;
          return;
        }
        case 'webgame:error': log.textContent = `error: ${d.message}`; return;
        default: log.textContent = d.type;
      }
    });

    document.getElementById('studio').href = '/studio.html?game=' + encodeURIComponent(name);
    meta = await fetch(`/examples/${encodeURIComponent(name)}/game.json`).then((r) => r.json()).catch(() => null);
    if (meta) document.title = `${meta.name} · Pixelforge Playground`;
    frame.src = '/player.html?game=' + encodeURIComponent(name);
    frame.onload = () => frame.focus();
  </script>
</body>
</html>
